name: 'Terraform Plan'

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

on:
    push:
      branches: [ "main" ]
    pull_request:
      branches: [ "main" ]


jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: PROD

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    # - name: Harden Runner
    #   uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
    #   with:
    #       disable-sudo: true
    #       egress-policy: audit
    #       allowed-endpoints: >
    #          github.com:443

    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }} 

    # - name: Configure AWS Credentials
    #   uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
    #   with:
    #       aws-access-key-id: ${{ secrets.NIKI_AWS_ACCESS_KEY_ID }}
    #       aws-secret-access-key: ${{ secrets.NIKI_AWS_SECRET_ACCESS_KEY }}
    #       aws-region: us-east-1

    #Setup Authentication with OIDC 
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
      with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.NIKI_OIDC_ROLE }}
          role-session-name: MySessionName

    - name: aws sts get caller
      run: aws sts get-caller-identity     

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init -backend-config=backend-niki.conf

    # # Checks that all Terraform configuration files adhere to a canonical format
    # - name: Terraform Format
    #   run: terraform fmt -check

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      run: terraform plan --var-file=prod.tfvars -input=false

      # On push to "main", build or change infrastructure according to Terraform configuration files
      # Note: It is recommended to set up a required "strict" status check in your repository for "Terraform Cloud". See the documentation on "strict" required status checks for more information: https://help.github.com/en/github/administering-a-repository/types-of-required-status-checks
    - name: Terraform Apply
      if: success() && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false --var-file=prod.tfvars
